<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chari Dungeon: ZERO — 1F タイル構成図</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090f18;color:#e9e6d9;font:15px system-ui}header{height:76px;display:flex;align-items:center;gap:24px;padding:12px 24px;border-bottom:1px solid #44515a;background:#111d2a}h1{font-size:20px;margin:0}small{color:#9badbb}main{display:grid;grid-template-columns:1fr 260px;height:calc(100dvh - 76px)}#view{overflow:auto;position:relative;background:#070d16;text-align:center;padding:20px}#map{display:block;margin:auto;max-width:none}aside{padding:20px;background:#101b28;overflow:auto}button,select{background:#203448;color:#f2ead4;border:1px solid #596574;border-radius:6px;padding:9px;margin:4px 0;cursor:pointer}button:hover{background:#36516a}select{width:100%}label{display:block;margin-top:14px}p{line-height:1.7;color:#b6c5d0}.badge{color:#d5ba76;font-size:12px}#legend{display:grid;gap:9px;margin-top:22px}.legend{display:flex;align-items:center;gap:9px}.dot{width:12px;height:12px;border-radius:3px} @media(max-width:700px){main{grid-template-columns:1fr}aside{position:absolute;right:8px;top:82px;width:190px;max-height:45vh;opacity:.95}header small{display:none}}</style>
<header><div><span class="badge">CHARI DUNGEON: ZERO · FLOOR 01</span><h1>石壁の迷宮 — タイル構成プレビュー</h1></div><small>88 × 84マス ／ 本道2マス・宝箱小道1マス ／ 宝箱41個（うち金6個）</small></header>
<main><div id="view"><canvas id="map" aria-label="実際の床・壁タイルで構成した迷路"></canvas></div><aside><span class="badge">LOCAL PREVIEW · 本番未反映</span><p>通路は灰色で統一。部屋の床だけ色分けしています。</p><button id="fit">全体を見る</button> <button id="actual">ゲームと同じ48px／マス</button><label>部屋へ移動<select id="room"><option value="">部屋を選択</option></select></label><button id="labels">部屋名を隠す</button><p id="description">床1枚＝移動1マス。壁は通れないマスに配置し、通路の幅を保っています。</p><button id="reroll">金箱の配置を再抽選（デモ）</button><p>幅1マス・奥行き3マスの宝箱小道を5か所追加。金箱6個は全41地点から抽選します。</p><div id="legend"></div><p><small>配置確認用です。泉とボス開始は動作デモで確認できます。本番の通信・戦闘処理には未反映です。</small></p></aside></main>
<script type="module">
const data=await (await fetch('/previews/floor-one-maze/layout.json')).json();const map=document.querySelector('#map'),view=document.querySelector('#view'),select=document.querySelector('#room');let zoom=1,labels=true;
function size(z){zoom=z;map.style.width=`${data.W*48*z}px`;map.style.height=`${data.H*48*z}px`}
function fit(){size(Math.min((view.clientWidth-40)/(data.W*48),(view.clientHeight-40)/(data.H*48)));view.scrollTo(0,0)}
const colors=['#a79a88','#6c9b8b','#ba9d73','#7e9ba9','#828d96','#9274a1','#977b57','#d1bc80','#995c68','#65b4a5'];
data.rooms.forEach((r,i)=>{select.add(new Option(`${r.id}  ${r.name}`,r.id));const row=document.createElement('div');row.className='legend';row.innerHTML=`<span class="dot" style="background:${colors[i]}"></span>${r.id} ${r.name}`;document.querySelector('#legend').append(row)});
document.querySelector('#fit').onclick=fit;document.querySelector('#actual').onclick=()=>{size(1);view.scrollTo(32*48,68*48)};
select.onchange=()=>{const r=data.rooms.find(r=>r.id===+select.value);if(!r)return;size(1);view.scrollTo({left:(r.x+r.w/2)*48-view.clientWidth/2+20,top:(r.y+r.h/2)*48-view.clientHeight/2+20});document.querySelector('#description').textContent=r.detail};
document.querySelector('#labels').onclick=e=>{labels=!labels;paint();e.target.textContent=labels?'部屋名を隠す':'部屋名を表示'};const load=src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src});
const [plain,named,common,gold]=await Promise.all(['/previews/floor-one-maze/background.webp','/previews/floor-one-maze/background-labeled.webp','/assets/items/chests-centered/treasure-chest-common.png','/assets/items/chests-centered/treasure-chest-rare.png'].map(load));
let selected=data.gold;try{const saved=JSON.parse(sessionStorage.getItem('maze-gold-v2'));if(Array.isArray(saved)&&saved.length===6&&new Set(saved.map(String)).size===6&&saved.every(p=>data.chestCandidates.some(c=>String(c)===String(p))))selected=saved}catch{}
map.width=data.W*48;map.height=data.H*48;
function paint(){const ctx=map.getContext('2d');ctx.drawImage(labels?named:plain,0,0);for(const [x,y] of data.chestCandidates)ctx.drawImage(selected.some(p=>p[0]===x&&p[1]===y)?gold:common,x*48+2,y*48+3,43,43)}
document.querySelector('#reroll').onclick=()=>{const pool=[...data.chestCandidates];for(let i=pool.length-1;i>0;i--){const a=new Uint32Array(1);crypto.getRandomValues(a);const j=Math.floor(a[0]/4294967296*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}selected=pool.slice(0,6);sessionStorage.setItem('maze-gold-v2',JSON.stringify(selected));paint();document.querySelector('#description').textContent='金箱6個を再抽選しました。再読み込みしてもこの配置を保持します。'};paint();fit();
</script><script type="module" src="/previews/floor-one-maze/interaction.mjs"></script></html>
