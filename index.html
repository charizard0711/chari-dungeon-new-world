      <script>
      // Match the default game bounds before the module bundle creates its canvas.
      (() => {
        const forced = new URLSearchParams(location.search).get('mobile');
        const mobile = forced === '1' || forced !== '0' && (innerWidth <= 520 || (('ontouchstart' in window || navigator.maxTouchPoints > 0) && Math.min(innerWidth, innerHeight) <= 700));
        const w = mobile ? 390 : 1280, h = mobile ? 844 : 760;
        const zoom = Math.min(mobile ? 1 : Infinity, innerWidth / w, innerHeight / h);
        document.documentElement.style.setProperty('--initial-game-width', `${w * zoom}px`);
        document.documentElement.style.setProperty('--initial-game-height', `${h * zoom}px`);
      })();
    </script>
