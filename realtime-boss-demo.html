<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZERO · リアルタイムボス戦デモ</title><style>
*{box-sizing:border-box}body{margin:0;background:#111315;color:#ece9e2;font:14px Meiryo,sans-serif;height:100dvh;display:flex;flex-direction:column}header{display:flex;gap:14px;align-items:center;padding:12px 20px;background:linear-gradient(#303437,#1b1e21);border-bottom:1px solid #797e80;flex-wrap:wrap}header strong{margin-right:auto}button,select{background:linear-gradient(#3a4147,#22272c);border:1px solid #858b8e;color:#fff;border-radius:5px;padding:9px 13px;cursor:pointer}button:hover{border-color:#dfc57b}button:disabled{opacity:.5;cursor:default}#stage{flex:1;min-height:0;position:relative}canvas{display:block}footer{padding:10px 18px;background:#1c2023;border-top:1px solid #565c60;display:flex;flex-wrap:wrap;gap:12px;align-items:center}#status{color:#f5d78f;min-width:240px}small{color:#c0c4c6}#touch{display:flex;gap:4px;margin-left:auto}#touch button{touch-action:none;min-width:43px}#attack{border-color:#c7a85b}label{display:flex;gap:7px;align-items:center}#health{font-variant-numeric:tabular-nums}#notice{position:absolute;top:45%;width:100%;pointer-events:none;text-align:center;font-size:24px;color:#ffe4ad;text-shadow:0 2px 5px #000;white-space:pre-line}@media(max-width:650px){body{font-size:11px}header{padding:7px;gap:6px}button,select{padding:7px;font-size:11px}header strong{width:100%}footer{padding:7px;gap:6px}#status{min-width:0;width:100%}#touch{margin-left:0}#notice{font-size:17px}}</style></head><body>
<header><strong>Chari Dungeon: ZERO · リアルタイム戦闘デモ</strong><button id="start">戦闘開始</button><label>武器<select id="weapon"><option value="longsword">片手剣</option><option value="greatsword">大剣</option><option value="bow">弓</option><option value="handgun">銃</option></select></label><label>自分の移動<select id="player-speed"><option value="152">標準</option><option value="130">軽快</option><option value="190">重装</option></select></label><label>ボスの移動<select id="boss-speed"><option value="152">プレイヤーと同速</option><option value="210">重厚</option><option value="130">素早い</option></select></label><label><input type="checkbox" id="ally">動く味方を表示</label><button id="phase">HPを区切りまで減らす</button><button id="reset">やり直す</button></header>
<div id="stage"><div id="notice"></div></div><footer><span id="health"></span><span id="status">読み込み中…</span><small>矢印 / WASD・地面クリック：移動　右クリック長押し / Space：攻撃　Q：回復</small><div id="touch"><button data-dir="up" aria-label="上へ移動">↑</button><button data-dir="left" aria-label="左へ移動">←</button><button data-dir="down" aria-label="下へ移動">↓</button><button data-dir="right" aria-label="右へ移動">→</button><button id="attack">攻撃</button><button id="heal">回復</button></div><small>ローカル・無音・本番未反映。味方は動作確認用で、実際の通信は行いません。</small></footer><script type="module" src="/src/realtimeBossDemo/main.ts"></script></body></html>
