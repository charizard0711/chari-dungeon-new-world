<!doctype html><html lang="ja"><meta charset="utf-8"><title>ZERO｜壁タイル比較デモ</title><style>*{box-sizing:border-box}body{margin:0;background:#080f16;color:#e6dac2;font:16px system-ui}main{max-width:1120px;margin:auto;padding:24px}h1{font-size:25px;margin:6px 0}p{color:#a4b4b8}nav{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}button{border:1px solid #68777b;background:#12242e;color:#eee0c2;border-radius:6px;padding:12px 18px;cursor:pointer}button.active{background:#395b60;border-color:#e0b96c}canvas{width:100%;display:block;border:1px solid #52656b;background:#070e15;border-radius:8px}footer{display:flex;justify-content:space-between;margin-top:14px;color:#a4b4b8}strong{color:#efce8a}</style><main><small>CHARI DUNGEON : ZERO · LOCAL PREVIEW</small><h1>古代遺跡の石壁</h1><p>一枚絵ではなく、新しい壁タイルをマスごとに配置。矢印・WASDで移動できます。</p><nav><button class="active" data-theme="0">通路：青灰色の石積み</button><button data-theme="1">泉：白石と青緑</button><button data-theme="2">ボス：黒石と金属</button><button id="old">旧壁と比較</button><button id="grid">マス線 ON / OFF</button></nav><canvas width="1008" height="624" aria-label="壁の比較と移動デモ"></canvas><footer><span id="status">タイルを読み込み中…</span><span>本番は変更していません · 無音</span></footer></main><script type="module">
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),T=48,W=21,H=13;let theme=0,old=false,grid=true,player={x:10,y:8},visual={x:10,y:8};
const urls=['/assets/online/wall-demo-v1/walls.png','/assets/online/maze-v1/floors.webp','/assets/terrain/ruins-low-v1/1/wall-a.png','/assets/terrain/objects/healing-fountain-pixel.png','/assets/online/maze-v2/cage-closed.png'];
const images=await Promise.all(urls.map(src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src})));const [atlas,floors,rock,fountain,cage]=images;
const ground=(x,y)=>x>=2&&x<=18&&y>=2&&y<=10&&(!(x===7||x===13)||y>=7&&y<=8);const wall=(x,y)=>!ground(x,y)&&[-1,0,1].some(dy=>[-1,0,1].some(dx=>ground(x+dx,y+dy)));
function frame(){ctx.clearRect(0,0,1008,624);for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(ground(x,y)){const f=theme===1?2:theme===2?4:0,cols=Math.floor(floors.width/128);ctx.drawImage(floors,(f%cols)*128,Math.floor(f/cols)*128,128,128,x*T,y*T,T,T);if(grid){ctx.strokeStyle='#0005';ctx.strokeRect(x*T+.5,y*T+.5,T-1,T-1)}}else if(wall(x,y)){if(old)ctx.drawImage(rock,x*T,y*T,T,T);else{const sw=atlas.width/3,sh=atlas.height/3,v=(x*7+y*3)%3;ctx.drawImage(atlas,v*sw,theme*sh,sw,sh,x*T,y*T,T,T);ctx.fillStyle='#050a1630';ctx.fillRect(x*T,y*T,T,T);if(ground(x,y+1)){ctx.fillStyle='#fff2';ctx.fillRect(x*T,y*T,T,2);ctx.fillStyle='#0006';ctx.fillRect(x*T,(y+1)*T-5,T,5)}}}}if(theme===1)ctx.drawImage(fountain,9*T,3*T,3*T,3*T);if(theme===2)ctx.drawImage(cage,9*T,1*T,3*T,3*T);visual.x+=(player.x-visual.x)*.24;visual.y+=(player.y-visual.y)*.24;const px=(visual.x+.5)*T,py=(visual.y+.5)*T;ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(px,py+13,14,6,0,0,7);ctx.fill();ctx.fillStyle='#e4bb66';ctx.beginPath();ctx.arc(px,py-5,9,0,7);ctx.fill();ctx.fillStyle='#3db5b9';ctx.beginPath();ctx.moveTo(px,py+1);ctx.lineTo(px-11,py+17);ctx.lineTo(px+11,py+17);ctx.fill();requestAnimationFrame(frame)}
function status(){document.querySelector('#status').innerHTML='<strong>'+['青灰色の石積み','泉の白石','ボスの黒石'][theme]+'</strong> / '+(old?'旧壁':'新壁')+' · 1マス48px · 2マス幅の通路';}document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=+b.dataset.theme;document.querySelectorAll('[data-theme]').forEach(c=>c.classList.toggle('active',c===b));status()});document.querySelector('#old').onclick=e=>{old=!old;e.target.classList.toggle('active',old);status()};document.querySelector('#grid').onclick=()=>grid=!grid;let at=0;document.addEventListener('keydown',e=>{const d={ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0],ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1]}[e.code];if(!d)return;e.preventDefault();if(performance.now()-at<150)return;at=performance.now();if(ground(player.x+d[0],player.y+d[1])){player.x+=d[0];player.y+=d[1]}});document.addEventListener('contextmenu',e=>e.preventDefault());status();frame();
</script></html>
